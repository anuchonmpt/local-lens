[package]
name = "cluster-observatory"
version = "0.1.4"
edition = "2021"

[dependencies]
eframe = "=0.31.1"
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3.55", features = ["parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
semver = "1.0"
tempfile = "3"

[profile.release]
opt-level = 2
