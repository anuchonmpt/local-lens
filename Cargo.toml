[package]
name = "cluster-observatory"
version = "0.1.14"
edition = "2021"

[dependencies]
base64 = "0.22"
eframe = "=0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3.55", features = ["parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
rfd = { version = "=0.17.2", default-features = false }
semver = "1.0"

[profile.release]
opt-level = 2
